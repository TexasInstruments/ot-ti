<svg xmlns="http://www.w3.org/2000/svg"
     width="670" height="340"
     viewBox="0 0 670 340"
     font-family="Arial, Helvetica, sans-serif">

  <defs>
    <!-- Red arrowhead -->
    <marker id="arrR" markerWidth="8" markerHeight="6"
            refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C41230"/>
    </marker>
    <!-- Dark grey arrowhead for wireless links -->
    <marker id="arrD" markerWidth="8" markerHeight="6"
            refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#555555"/>
    </marker>
    <!-- Clip path to round bottom band corners of the cc13xx box -->
    <clipPath id="ccClip">
      <rect x="55" y="200" width="350" height="87" rx="6"/>
    </clipPath>
  </defs>

  <!-- ═══════════════════════════════════════════════════════════
       LINUX HOST OUTER BOX
  ════════════════════════════════════════════════════════════════ -->
  <rect x="5" y="5" width="415" height="140" rx="6"
        fill="#F0F4F8" stroke="#4A6FA5" stroke-width="2"/>
  <text x="20" y="23" font-size="13" font-weight="bold" fill="#4A6FA5">Linux Host</text>

  <!-- Application strip -->
  <rect x="15" y="28" width="395" height="22" rx="3"
        fill="#D6E4F0" stroke="#4A6FA5" stroke-width="1"/>
  <text x="212" y="43" font-size="11" fill="#333333"
        text-anchor="middle">Application (e.g. Matter)</text>

  <!-- ── OTBR box ── -->
  <rect x="95" y="62" width="95" height="48" rx="4"
        fill="white" stroke="#C41230" stroke-width="1.5"/>
  <text x="142" y="91" font-size="14" font-weight="bold"
        fill="#C41230" text-anchor="middle">OTBR</text>

  <!-- ── BlueZ box ── -->
  <rect x="270" y="62" width="95" height="48" rx="4"
        fill="white" stroke="#C41230" stroke-width="1.5"/>
  <text x="317" y="91" font-size="14" font-weight="bold"
        fill="#C41230" text-anchor="middle">BlueZ</text>

  <!-- ═══════════════════════════════════════════════════════════
       DUAL-UART CONNECTIONS (bidirectional red arrows)
  ════════════════════════════════════════════════════════════════ -->

  <!-- Left UART (Thread / XDS110) — down -->
  <line x1="139" y1="110" x2="139" y2="198"
        stroke="#C41230" stroke-width="1.5"
        stroke-dasharray="5,3" marker-end="url(#arrR)"/>
  <!-- Left UART — up -->
  <line x1="145" y1="198" x2="145" y2="110"
        stroke="#C41230" stroke-width="1.5"
        stroke-dasharray="5,3" marker-end="url(#arrR)"/>

  <!-- Right UART (BLE / FTDI) — down -->
  <line x1="314" y1="110" x2="314" y2="198"
        stroke="#C41230" stroke-width="1.5"
        stroke-dasharray="5,3" marker-end="url(#arrR)"/>
  <!-- Right UART — up -->
  <line x1="320" y1="198" x2="320" y2="110"
        stroke="#C41230" stroke-width="1.5"
        stroke-dasharray="5,3" marker-end="url(#arrR)"/>

  <!-- UART labels (in the gap between Linux Host and cc13xx) -->
  <!-- Left -->
  <text x="142" y="152" font-size="8.5" fill="#555555"
        text-anchor="middle">UART1 (XDS110)</text>
  <text x="142" y="163" font-size="8.5" fill="#555555"
        text-anchor="middle">/dev/ttyACM0</text>
  <text x="142" y="175" font-size="8" fill="#888888"
        text-anchor="middle">Thread Spinel</text>
  <!-- Right -->
  <text x="317" y="152" font-size="8.5" fill="#555555"
        text-anchor="middle">UART2 (FTDI)</text>
  <text x="317" y="163" font-size="8.5" fill="#555555"
        text-anchor="middle">/dev/ttyUSB0</text>
  <text x="317" y="175" font-size="8" fill="#888888"
        text-anchor="middle">BLE HCI</text>

  <!-- ═══════════════════════════════════════════════════════════
       cc13xx DEVICE BOX
  ════════════════════════════════════════════════════════════════ -->
  <rect x="55" y="200" width="350" height="87" rx="6"
        fill="#FFFBE6" stroke="#E65100" stroke-width="2"/>

  <!-- Board name (full-width) -->
  <text x="230" y="219" font-size="10" font-weight="bold"
        fill="#E65100" text-anchor="middle">LP_EM_CC1354P10_6</text>

  <!-- Horizontal separator below board name -->
  <line x1="55" y1="226" x2="405" y2="226"
        stroke="#E65100" stroke-width="0.8" stroke-dasharray="3,2"/>

  <!-- Vertical divider between Thread and BLE sections -->
  <line x1="230" y1="226" x2="230" y2="272"
        stroke="#CCCCCC" stroke-width="1"/>

  <!-- Left section: Thread Spinel / RCP -->
  <text x="142" y="246" font-size="10" fill="#555555"
        text-anchor="middle">Thread Spinel</text>
  <text x="142" y="260" font-size="9.5" fill="#888888"
        text-anchor="middle">(RCP)</text>

  <!-- Right section: BLE HCI -->
  <text x="317" y="246" font-size="10" fill="#555555"
        text-anchor="middle">BLE HCI</text>
  <text x="317" y="260" font-size="9.5" fill="#888888"
        text-anchor="middle">(BLE-Controller)</text>

  <!-- Teal bottom band (clipped to box rounded corners) -->
  <rect x="55" y="272" width="350" height="15" rx="3"
        fill="#00778B" clip-path="url(#ccClip)"/>
  <text x="230" y="283" font-size="9" font-weight="bold"
        fill="white" text-anchor="middle">DMM / CC13xx</text>

  <!-- ═══════════════════════════════════════════════════════════
       WIRELESS DEVICE BOXES (right side)
  ════════════════════════════════════════════════════════════════ -->
  <!-- BLE Device box -->
  <rect x="490" y="210" width="155" height="38" rx="4"
        fill="white" stroke="#666666" stroke-width="1.5"/>
  <text x="567" y="233" font-size="12" fill="#333333"
        text-anchor="middle">BLE Device</text>

  <!-- Thread Device box -->
  <rect x="490" y="265" width="155" height="38" rx="4"
        fill="white" stroke="#666666" stroke-width="1.5"/>
  <text x="567" y="288" font-size="12" fill="#333333"
        text-anchor="middle">Thread Device</text>

  <!-- ── BLE wireless arrow (dashed) ── -->
  <line x1="405" y1="228" x2="488" y2="229"
        stroke="#555555" stroke-width="1.5"
        stroke-dasharray="5,3" marker-end="url(#arrD)"/>
  <text x="446" y="222" font-size="10" fill="#555555"
        text-anchor="middle">BLE</text>

  <!-- ── Thread wireless arrow (solid) ── -->
  <line x1="405" y1="257" x2="488" y2="280"
        stroke="#555555" stroke-width="1.5" marker-end="url(#arrD)"/>
  <text x="446" y="276" font-size="10" fill="#555555"
        font-style="italic" text-anchor="middle">Thread</text>

</svg>
